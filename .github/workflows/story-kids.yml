name: Story - Kids
# The kids' illustrated story (public Thursday and Sunday 10:00 IST on the kids' channel).
# Runs every day: on its own days (Tue, Thu, Sat) it makes the story in progress or starts the next one; on
# the other days it only uploads an approved story or redoes a story sent back for rework.
# STOP this pipeline: Actions > Story - Kids > "..." > Disable workflow (or pipeline_pause.bat on the laptop).
run-name: Story - Kids${{ github.event_name == 'workflow_dispatch' && ' (by hand)' || '' }}
on:
  schedule:
    - cron: "31 19 * * *"   # 01:00 IST
    - cron: "31 1 * * *"    # 07:00 IST, a second start
  workflow_dispatch:
    inputs:
      upload:
        description: Upload when the story is finished and approved
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  story:
    uses: ./.github/workflows/_story.yml
    with:
      series: kids
      pipeline: story-kids
      days: "2,4,6"
      upload: ${{ github.event_name == 'schedule' || inputs.upload }}
    secrets: inherit

name: _story (shared steps, not run on its own)

# The steps both story pipelines share (story-adults.yml, story-kids.yml), each with its own name,
# schedule and on/off switch:
#   - stop one in GitHub: Actions > the pipeline > "..." > Disable workflow
#   - or from the laptop: pipeline_pause.bat
# A story takes more than one run: its pictures are painted on Kaggle (over an hour) and its voices
# are acted by Gemini's free speech model, which allows a limited number of lines a day. Unfinished
# work (pictures, voice lines) is kept between runs in the Actions cache.
on:
  workflow_call:
    inputs:
      series: {type: string, required: true}       # adults | kids
      pipeline: {type: string, required: true}     # its name in pauses.json
      days: {type: string, required: true}         # India weekdays (0 = Sunday) on which it makes stories
      upload: {type: boolean, default: true}

jobs:
  story:
    runs-on: windows-latest
    timeout-minutes: 330
    concurrency:
      group: story
      cancel-in-progress: false
    env:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_STORIES: ${{ secrets.GEMINI_API_KEY_STORIES }}
      YT_CLIENT_SECRET_FILE: ${{ github.workspace }}\client_secret.json
      YT_TOKEN_FILE: ${{ github.workspace }}\youtube_token.json
      YT_TOKEN_FILE_KIDS: ${{ github.workspace }}\kids_token.json
    steps:
      - uses: actions/checkout@v4

      - name: The shared record (which stories are written and scheduled)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: .cache/assets_repo

      - name: What to do today
        id: plan
        shell: pwsh
        run: |
          $series = "${{ inputs.series }}"; $upload = "${{ inputs.upload }}".ToLower()
          $now = [DateTime]::UtcNow.AddHours(5.5)
          $myday = "${{ inputs.days }}".Split(",") -contains ([int]$now.DayOfWeek).ToString()
          $skip = ""
          $pauses = ".cache/assets_repo/pauses.json"
          if (Test-Path $pauses) {
            $p = Get-Content $pauses -Raw -Encoding utf8 | ConvertFrom-Json
            if ($p."${{ inputs.pipeline }}" -or $p.all) { $skip = "this pipeline is PAUSED (pipeline_pause.bat on the laptop resumes it)" }
          }
          # On any day: an approved story of this series to upload, or one sent back for rework.
          $urgent = Get-ChildItem .cache/assets_repo/story_episodes -Directory -Filter "$series-*" -ErrorAction SilentlyContinue | Where-Object {
            $f = $_.FullName
            ((Get-Content "$f/maker.json" -Raw -ErrorAction SilentlyContinue) -match "cloud") -and -not (Test-Path "$f/published.json") -and (
              (Test-Path "$f/approved.json") -or ((Test-Path "$f/rework.json") -and -not ((Test-Path "$f/rework_done.json") -and
                ((Get-Content "$f/rework_done.json" -Raw) -match ((Get-Content "$f/rework.json" -Raw | ConvertFrom-Json).id))))) } | Select-Object -First 1
          if (-not $skip -and "${{ github.event_name }}" -eq "schedule" -and -not $myday -and -not $urgent) {
            $skip = "not a ${{ inputs.series }} story day (one series a day uses the day's free voice lines)"
          }
          $todo = if ($skip) { "no" } else { "yes" }
          "series=$series", "upload=$upload", "todo=$todo" | Add-Content $env:GITHUB_OUTPUT
          if ($skip) { Write-Host "::notice title=${{ inputs.pipeline }}::Skipped: $skip" }
          else { Write-Host "::notice title=${{ inputs.pipeline }}::Working on the $series story (upload: $upload)" }

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.todo == 'yes'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/constraints.txt

      - name: FFmpeg and models (kept between runs)
        if: steps.plan.outputs.todo == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            checkpoints
            tools/ffmpeg
            SadTalker/gfpgan/weights
          key: models-v1

      - name: Stories in progress (kept between runs)
        if: steps.plan.outputs.todo == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            story_episodes
            .cache/story_actor
          key: stories-${{ github.run_id }}
          restore-keys: stories-

      - name: Set up the machine
        if: steps.plan.outputs.todo == 'yes'
        shell: pwsh
        run: |
          try { ./ci/setup.ps1 -NoVoice } catch { Write-Host "::error title=setup failed::$($_ | Out-String)"; exit 1 }

      - name: Put the keys in place
        if: steps.plan.outputs.todo == 'yes'
        shell: pwsh
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_TOKEN_KIDS_JSON: ${{ secrets.YT_TOKEN_KIDS_JSON }}
        run: |
          if (-not $env:GEMINI_API_KEY_STORIES) { Write-Host "::warning title=story::The GEMINI_API_KEY_STORIES secret is not set: stories share the Shorts' key (fewer free requests a day)" }
          New-Item -ItemType Directory -Force "$HOME/.kaggle" | Out-Null
          [IO.File]::WriteAllText("$HOME/.kaggle/access_token", $env:KAGGLE_ACCESS_TOKEN.Trim())
          [IO.File]::WriteAllText($env:YT_CLIENT_SECRET_FILE, $env:YT_CLIENT_SECRET_JSON)
          [IO.File]::WriteAllText($env:YT_TOKEN_FILE, $env:YT_TOKEN_JSON)
          if ($env:YT_TOKEN_KIDS_JSON) { [IO.File]::WriteAllText($env:YT_TOKEN_FILE_KIDS, $env:YT_TOKEN_KIDS_JSON) }
          $global:LASTEXITCODE = 0

      - name: Make the story
        if: steps.plan.outputs.todo == 'yes'
        shell: pwsh
        run: |
          git -C .cache/assets_repo config user.name "cloud"; git -C .cache/assets_repo config user.email "cloud@users.noreply.github.com"
          $extra = @("--scheduled"); if ("${{ steps.plan.outputs.upload }}" -ne "true") { $extra += "--no-upload" }
          python -m stories run --series ${{ steps.plan.outputs.series }} @extra 2>&1 | Tee-Object -FilePath story.log
          $code = $LASTEXITCODE
          $last = (Get-Content story.log | Where-Object { $_ -match "^\d\d:\d\d:\d\d (INFO|WARNING|ERROR)" -and $_ -match "✅|▶|ERROR|WARNING|uploaded|stopped|waiting|scene \d+ of|thumbnail|s of story" } | Select-Object -Last 12) -join "%0A"
          if ($code -ne 0) { Write-Host "::error title=the story run stopped::$last"; exit $code }
          Write-Host "::notice title=${{ steps.plan.outputs.series }} story::$last"

      - name: The finished video and thumbnail (kept 7 days)
        if: always() && steps.plan.outputs.todo == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pipeline }}-${{ github.run_number }}
          path: |
            story_episodes/*/video.mp4
            story_episodes/*/thumbnail.jpg
            story_episodes/*/script.json
            story.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Tidy what is kept for the next run
        if: always() && steps.plan.outputs.todo == 'yes'
        shell: pwsh
        run: |
          # A story that is uploaded no longer needs its pictures and video here (its script and
          # record stay, so its topic and release slot are known to later runs).
          Get-ChildItem story_episodes -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path "$($_.FullName)/published.json" } | ForEach-Object {
            Remove-Item "$($_.FullName)/pictures", "$($_.FullName)/video.mp4" -Recurse -Force -ErrorAction SilentlyContinue
          }
          $global:LASTEXITCODE = 0

name: Short - Murugan
# Baby Murugan's message on BrahmaNadagam, in turn with Mahaperiyava (one Short a day).
# Public 18:30 every other day IST (days counted from 18 Oct 2026). Several starts per day: GitHub often runs schedules late or skips one; the
# first start that works makes and uploads the Short, the later ones see it is done and stop.
# STOP this pipeline: Actions > Short - Murugan > "..." > Disable workflow (or pipeline_pause.bat on the laptop).
run-name: Short - Murugan${{ github.event_name == 'workflow_dispatch' && ' (by hand)' || '' }}
on:
  schedule:
    - cron: "17 22 * * *"   # 03:47 IST
    - cron: "47 0 * * *"   # 06:17 IST
    - cron: "47 3 * * *"   # 09:17 IST
    - cron: "17 9 * * *"   # 14:47 IST
    - cron: "47 11 * * *"   # 17:17 IST
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to YouTube (off = make only; the video is attached to the run)
        type: boolean
        default: false
permissions:
  contents: write   # only for the "keep the schedule active" commit
jobs:
  short:
    uses: ./.github/workflows/_short.yml
    with:
      series: murugan
      pipeline: short-murugan
      upload: ${{ github.event_name == 'schedule' || inputs.upload }}
      publish_hour: 18
      every: 2
      turn: 0
    secrets: inherit

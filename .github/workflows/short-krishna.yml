name: Short - Kids Krishna
# Kutti Krishna's good habit for children on the kids' channel, in turn with Kutti Murugan.
# Public 17:30 every other day IST (days counted from 18 Oct 2026). Several starts per day: GitHub often runs schedules late or skips one; the
# first start that works makes and uploads the Short, the later ones see it is done and stop.
# STOP this pipeline: Actions > Short - Kids Krishna > "..." > Disable workflow (or pipeline_pause.bat on the laptop).
run-name: Short - Kids Krishna${{ github.event_name == 'workflow_dispatch' && ' (by hand)' || '' }}
on:
  schedule:
    - cron: "7 23 * * *"   # 04:37 IST
    - cron: "37 2 * * *"   # 08:07 IST
    - cron: "37 6 * * *"   # 12:07 IST
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to YouTube (off = make only; the video is attached to the run)
        type: boolean
        default: false
permissions:
  contents: write   # only for the "keep the schedule active" commit
jobs:
  short:
    uses: ./.github/workflows/_short.yml
    with:
      series: krishna
      pipeline: short-krishna
      upload: ${{ github.event_name == 'schedule' || inputs.upload }}
      publish_hour: 17
      every: 2
      turn: 1
    secrets: inherit

name: Make a Story

# The long illustrated stories, made and scheduled in the cloud with the laptop switched off: the
# same pipeline as story_adults.bat / story_kids.bat (python -m stories run).
#
#   grown-ups' stories  -> the main channel, public Wednesday and Saturday 19:00 IST
#   kids' stories       -> the kids' own channel, public Thursday and Sunday 10:00 IST
# A story takes more than one run: its pictures are painted on Kaggle (over an hour) and its
# voices are acted by Gemini's free speech models, which allow a limited number of lines a day.
# So this runs every day, one series a day in turn, and each run does today's share: it continues
# the story in progress, or starts a new one when fewer than two are waiting to go public.
# Unfinished work (pictures, voice lines) is kept between runs in the Actions cache.
# It can also be started by hand: Actions tab > Make a Story > Run workflow.
on:
  schedule:
    # 19:30 UTC = 01:00 IST: after the free speech allowance of the day before has come back.
    - cron: "30 19 * * *"
    - cron: "30 1 * * *"    # 07:00 IST: a second start, in case GitHub skipped or delayed the first
  workflow_dispatch:
    inputs:
      series:
        description: Which series
        type: choice
        options: [adults, kids]
        default: adults
      upload:
        description: Upload to YouTube when the story is finished
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: story
  cancel-in-progress: false

jobs:
  story:
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_STORIES: ${{ secrets.GEMINI_API_KEY_STORIES }}
      YT_CLIENT_SECRET_FILE: ${{ github.workspace }}\client_secret.json
      YT_TOKEN_FILE: ${{ github.workspace }}\youtube_token.json
      YT_TOKEN_FILE_KIDS: ${{ github.workspace }}\kids_token.json
    steps:
      - uses: actions/checkout@v4

      - name: The shared record (which stories are written and scheduled)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: .cache/assets_repo

      - name: Which series today
        id: plan
        shell: pwsh
        run: |
          $series = "${{ inputs.series }}"; $upload = "${{ inputs.upload }}"
          if ("${{ github.event_name }}" -eq "schedule") {
            # one series a day in turn (India date): the day's free voice lines go to one story
            $day = [DateTime]::UtcNow.AddHours(5.5).Date
            $series = if ((($day - [DateTime]::ParseExact("2026-10-12", "yyyy-MM-dd", $null)).Days % 2) -eq 0) { "adults" } else { "kids" }
            $upload = "true"
          }
          "series=$series", "upload=$upload" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "::notice title=story::Today's series: $series (upload: $upload)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/constraints.txt

      - name: FFmpeg and models (kept between runs)
        uses: actions/cache@v4
        with:
          path: |
            checkpoints
            tools/ffmpeg
            SadTalker/gfpgan/weights
          key: models-v1

      - name: Stories in progress (kept between runs)
        uses: actions/cache@v4
        with:
          path: |
            story_episodes
            .cache/story_actor
          key: stories-${{ github.run_id }}
          restore-keys: stories-

      - name: Set up the machine
        shell: pwsh
        run: |
          try { ./ci/setup.ps1 -NoVoice } catch { Write-Host "::error title=setup failed::$($_ | Out-String)"; exit 1 }

      - name: Put the keys in place
        shell: pwsh
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_TOKEN_KIDS_JSON: ${{ secrets.YT_TOKEN_KIDS_JSON }}
        run: |
          if (-not $env:GEMINI_API_KEY_STORIES) { Write-Host "::warning title=story::The GEMINI_API_KEY_STORIES secret is not set: stories share the Shorts' key (fewer free requests a day)" }
          New-Item -ItemType Directory -Force "$HOME/.kaggle" | Out-Null
          [IO.File]::WriteAllText("$HOME/.kaggle/access_token", $env:KAGGLE_ACCESS_TOKEN.Trim())
          [IO.File]::WriteAllText($env:YT_CLIENT_SECRET_FILE, $env:YT_CLIENT_SECRET_JSON)
          [IO.File]::WriteAllText($env:YT_TOKEN_FILE, $env:YT_TOKEN_JSON)
          if ($env:YT_TOKEN_KIDS_JSON) { [IO.File]::WriteAllText($env:YT_TOKEN_FILE_KIDS, $env:YT_TOKEN_KIDS_JSON) }
          $global:LASTEXITCODE = 0

      - name: Make the story
        shell: pwsh
        run: |
          git -C .cache/assets_repo config user.name "cloud"; git -C .cache/assets_repo config user.email "cloud@users.noreply.github.com"
          $extra = @("--scheduled"); if ("${{ steps.plan.outputs.upload }}" -ne "true") { $extra += "--no-upload" }
          python -m stories run --series ${{ steps.plan.outputs.series }} @extra 2>&1 | Tee-Object -FilePath story.log
          $code = $LASTEXITCODE
          $last = (Get-Content story.log | Where-Object { $_ -match "^\d\d:\d\d:\d\d (INFO|WARNING|ERROR)" -and $_ -match "✅|▶|ERROR|WARNING|uploaded|stopped|waiting|scene \d+ of|thumbnail|s of story" } | Select-Object -Last 12) -join "%0A"
          if ($code -ne 0) { Write-Host "::error title=the story run stopped::$last"; exit $code }
          Write-Host "::notice title=${{ steps.plan.outputs.series }} story::$last"

      - name: The finished video and thumbnail (kept 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-${{ steps.plan.outputs.series }}
          path: |
            story_episodes/*/video.mp4
            story_episodes/*/thumbnail.jpg
            story_episodes/*/script.json
            story.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Tidy what is kept for the next run
        if: always()
        shell: pwsh
        run: |
          # A story that is uploaded no longer needs its pictures and video here (its script and
          # record stay, so its topic and release slot are known to later runs).
          Get-ChildItem story_episodes -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path "$($_.FullName)/published.json" } | ForEach-Object {
            Remove-Item "$($_.FullName)/pictures", "$($_.FullName)/video.mp4" -Recurse -Force -ErrorAction SilentlyContinue
          }
          $global:LASTEXITCODE = 0

name: Make a Short

# ONE Short a day at 18:30 IST, made and uploaded in the cloud with the laptop switched off (the
# same autopilot as the .bat files). Murugan and Mahaperiyava take alternate days:
#
#   12 Oct 2026 Murugan, 13 Oct Mahaperiyava, 14 Oct Murugan, ...   (see "anchor" below)
# The Ramana Maharshi series is built but on hold (no pictures yet): it can be started by hand.
# Starts: 03:47, 06:17, 09:17, 14:47 and 17:17 IST. The first start that succeeds makes and
# uploads the Short; later starts see it is done and stop in seconds. They exist because GitHub
# runs schedules late (often by hours) or skips one.
# It can also be started by hand: Actions tab > Make a Short > Run workflow.
#
# Private files (pictures, voice sample, music, chapter text) and the shared history live in a
# second, private repository named by the ASSETS_REPO variable; the laptop reads and writes the
# same history, so a Short is never posted twice. Keys are repository secrets.
on:
  schedule:
    # Times are UTC. GitHub starts scheduled runs late, often by hours (seen: 1 to 5 hours),
    # so every start is early enough that even a 5-hour delay still meets the publish time, and
    # each series has three starts. Minute 17 = the first start of the series.
    - cron: "17 22 * * *"   # 03:47 IST   (public 18:30 IST that day)
    - cron: "47 0 * * *"    # 06:17 IST
    - cron: "47 3 * * *"    # 09:17 IST
    - cron: "17 9 * * *"    # 14:47 IST
    - cron: "47 11 * * *"   # 17:17 IST, last chance
  workflow_dispatch:
    inputs:
      series:
        description: Which series
        type: choice
        options: [periyava, murugan, ramana]
        default: periyava
      upload:
        description: Upload to YouTube (off = make only; the video is attached to the run)
        type: boolean
        default: false

permissions:
  contents: write   # only for the "keep the schedule active" commit below

concurrency:
  group: short-${{ github.event.schedule || inputs.series }}
  cancel-in-progress: false

jobs:
  short:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YT_CLIENT_SECRET_FILE: ${{ github.workspace }}\client_secret.json
      YT_TOKEN_FILE: ${{ github.workspace }}\youtube_token.json
    steps:
      - uses: actions/checkout@v4

      - name: Private files and the shared history
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: .cache/assets_repo

      - name: What to make today
        id: plan
        shell: pwsh
        run: |
          $series = "${{ inputs.series }}"; $upload = "${{ inputs.upload }}"
          $scheduled = "${{ github.event_name }}" -eq "schedule"
          # Which day's Short this is, in India time. A start that GitHub ran so late that it is
          # already past 18:00 is skipped: the 18:30 slot is gone.
          $now = [DateTime]::UtcNow.AddHours(5.5)
          $day = $now.ToString("yyyy-MM-dd")
          $late = $false
          if ($scheduled) {
            $upload = "true"
            # One Short a day, the two series on alternate days. anchor = a Murugan day.
            $anchor = [DateTime]::ParseExact("2026-10-12", "yyyy-MM-dd", $null)
            $turn = ((($now.Date - $anchor).Days % 2) + 2) % 2
            $series = if ($turn -eq 0) { "murugan" } else { "periyava" }
            if ($now.Hour -ge 18) { $late = $true }
          }
          $folder = if ($series -eq "murugan") { "auto" } else { $series }
          $done = $false
          if ($upload -eq "true") {
            # Done when ANY series already has a Short that goes public today (so there is never a
            # second Short on one day, whichever series or start made the first).
            foreach ($f in "auto", "periyava", "ramana") {
              $history = ".cache/assets_repo/episodes/$f/history.json"
              if (-not (Test-Path $history)) { continue }
              foreach ($r in (Get-Content $history -Raw -Encoding utf8 | ConvertFrom-Json)) {
                if (-not $r.video_id) { continue }
                $public = if ($r.publish_at) { ([DateTime]::Parse($r.publish_at, $null, "AdjustToUniversal")).AddHours(5.5).ToString("yyyy-MM-dd") } else { $r.date }
                if ($public -eq $day -or ($f -eq $folder -and $r.date -eq $day)) { $done = $true }
              }
            }
          }
          # Scheduled runs never post a Short whose face doesn't talk: if the talking face can't be
          # made the run fails (GitHub emails you) and the next start tries again.
          $strict = if ("${{ github.event_name }}" -eq "schedule" -or $upload -eq "true") { "1" } else { "0" }
          if ($late) { $done = $true }
          "series=$series", "upload=$upload", "day=$day", "strict=$strict", "todo=$(if ($done) { 'no' } else { 'yes' })" | Add-Content $env:GITHUB_OUTPUT
          if ($late) { Write-Host "::warning title=$series::This start ran too late for today's publish time -- skipped (the next day's starts carry on as usual)" }
          elseif ($done) { Write-Host "::notice title=$series::A Short is already uploaded for $day -- nothing to do" }
          else { Write-Host "::notice title=$series::Making the Short for $day (upload: $upload)" }

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.todo == 'yes'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/constraints.txt

      - name: Voice model and FFmpeg (kept between runs)
        if: steps.plan.outputs.todo == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            checkpoints
            tools/ffmpeg
            SadTalker/gfpgan/weights
          key: models-v1

      - name: Set up the machine
        if: steps.plan.outputs.todo == 'yes'
        shell: pwsh
        run: |
          try { ./ci/setup.ps1 } catch { Write-Host "::error title=setup failed::$($_ | Out-String)"; exit 1 }

      - name: Put the private files and keys in place
        if: steps.plan.outputs.todo == 'yes'
        shell: pwsh
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          robocopy .cache/assets_repo . /E /XD .git /XF README.md /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { Write-Host "::error::could not copy the private files"; exit 1 }
          git -C .cache/assets_repo config user.name "cloud"; git -C .cache/assets_repo config user.email "cloud@users.noreply.github.com"
          New-Item -ItemType Directory -Force "$HOME/.kaggle" | Out-Null
          [IO.File]::WriteAllText("$HOME/.kaggle/access_token", $env:KAGGLE_ACCESS_TOKEN.Trim())
          [IO.File]::WriteAllText($env:YT_CLIENT_SECRET_FILE, $env:YT_CLIENT_SECRET_JSON)
          [IO.File]::WriteAllText($env:YT_TOKEN_FILE, $env:YT_TOKEN_JSON)
          $global:LASTEXITCODE = 0

      - name: Make the Short
        if: steps.plan.outputs.todo == 'yes'
        shell: pwsh
        env:
          SHORTS_REQUIRE_TALKING: ${{ steps.plan.outputs.strict }}
        run: |
          $extra = @(); if ("${{ steps.plan.outputs.upload }}" -ne "true") { $extra += "--no-upload" }
          python -m autopilot --series ${{ steps.plan.outputs.series }} run --scheduled --date ${{ steps.plan.outputs.day }} @extra 2>&1 | Tee-Object -FilePath run.log
          $code = $LASTEXITCODE
          $last = (Get-Content run.log | Where-Object { $_ -match "^\d\d:\d\d:\d\d (INFO|WARNING|ERROR)" -and $_ -match "✅|⏸|ERROR|WARNING|Uploaded|stopped|Already|talking head|animated|title:" } | Select-Object -Last 10) -join "%0A"
          if ($code -ne 0) { Write-Host "::error title=the Short was not made::$last"; exit $code }
          if ($last -match "⏸") { Write-Host "::error title=made but NOT uploaded (YouTube sign-in expired: update the YT_TOKEN_JSON secret)::$last"; exit 1 }
          if (Select-String -Path run.log -Pattern "talking head skipped|using the still picture|no laptop fallback" -Quiet) {
            Write-Host "::warning title=${{ steps.plan.outputs.series }}: made WITHOUT the talking face (still picture)::$last"
          }
          Write-Host "::notice title=${{ steps.plan.outputs.series }}::$last"

      - name: The video (kept 7 days)
        if: always() && steps.plan.outputs.todo == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ steps.plan.outputs.series }}
          path: |
            Final/**/*.mp4
            episodes/**/run.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the shared history
        if: always() && steps.plan.outputs.todo == 'yes'
        shell: pwsh
        run: |
          python -m autopilot sync
          $global:LASTEXITCODE = 0

      - name: Keep the schedule active
        # GitHub switches a schedule off after 60 days without a commit in this repository.
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $age = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64](git log -1 --format=%ct)) / 86400
          if ($age -gt 40) {
            git config user.name "cloud"; git config user.email "cloud@users.noreply.github.com"
            git commit -q --allow-empty -m "Keep the daily schedule active"
            git push -q
          }
          $global:LASTEXITCODE = 0

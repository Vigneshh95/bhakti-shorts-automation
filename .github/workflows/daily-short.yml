name: Make a Short

# Makes one Short in the cloud, with the laptop switched off: the same autopilot as the .bat files.
# TRIAL: started by hand (Actions tab > Make a Short > Run workflow). Add a `schedule:` trigger only
# once this is chosen over the laptop's daily task; both running would post twice a day.
#
# Private files live in a second, private repository (pictures, voice sample, background music,
# the collected chapter text, and the run history), named by the ASSETS_REPO variable. Keys are
# repository secrets; nothing secret is in this repository or printed in the logs.
on:
  workflow_dispatch:
    inputs:
      series:
        description: Which series
        type: choice
        options: [periyava, murugan]
        default: periyava
      upload:
        description: Upload to YouTube (off = make only; the video is attached to the run)
        type: boolean
        default: false

concurrency:
  group: short-${{ inputs.series }}
  cancel-in-progress: false

jobs:
  short:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YT_CLIENT_SECRET_FILE: ${{ github.workspace }}\client_secret.json
      YT_TOKEN_FILE: ${{ github.workspace }}\youtube_token.json
    steps:
      - uses: actions/checkout@v4

      - name: Private files (pictures, voice sample, music, chapter text, history)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: _assets

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/constraints.txt

      - name: Voice model and FFmpeg (kept between runs)
        uses: actions/cache@v4
        with:
          path: |
            checkpoints
            tools/ffmpeg
            SadTalker/gfpgan/weights
          key: models-v1

      - name: Set up the machine
        shell: pwsh
        run: |
          try { ./ci/setup.ps1 } catch { Write-Host "::error title=setup failed::$($_ | Out-String)"; exit 1 }

      - name: Put the private files and keys in place
        shell: pwsh
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          robocopy _assets . /E /XD .git /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { Write-Host "::error::could not copy the private files"; exit 1 }
          New-Item -ItemType Directory -Force "$HOME/.kaggle" | Out-Null
          [IO.File]::WriteAllText("$HOME/.kaggle/access_token", $env:KAGGLE_ACCESS_TOKEN.Trim())
          [IO.File]::WriteAllText($env:YT_CLIENT_SECRET_FILE, $env:YT_CLIENT_SECRET_JSON)
          [IO.File]::WriteAllText($env:YT_TOKEN_FILE, $env:YT_TOKEN_JSON)
          $global:LASTEXITCODE = 0

      - name: Make the Short
        shell: pwsh
        run: |
          $extra = @(); if ("${{ inputs.upload }}" -ne "true") { $extra += "--no-upload" }
          python -m autopilot --series ${{ inputs.series }} run --scheduled @extra 2>&1 | Tee-Object -FilePath run.log
          $code = $LASTEXITCODE
          $last = (Get-Content run.log | Where-Object { $_ -match "✅|ERROR|Uploaded|stopped" } | Select-Object -Last 6) -join "%0A"
          if ($code -ne 0) { Write-Host "::error title=the Short was not made::$last"; exit $code }
          Write-Host "::notice title=${{ inputs.series }}::$last"

      - name: The video (kept 7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ inputs.series }}
          path: |
            Final/**/*.mp4
            episodes/**/run.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the history (what was used and uploaded) to the private repository
        if: always()
        shell: pwsh
        run: |
          $keep = "episodes/auto/history.json", "episodes/periyava/history.json", "episodes/periyava/playlist.json",
                  "daily_images/.library.json", "periyava_images/.library.json", "sources/deivathin_kural/verdicts.json"
          foreach ($f in $keep) {
            if (Test-Path $f) { New-Item -ItemType Directory -Force (Split-Path "_assets/$f") | Out-Null; Copy-Item $f "_assets/$f" -Force }
          }
          Get-ChildItem episodes -Recurse -Filter script.json -ErrorAction SilentlyContinue | ForEach-Object {
            $rel = Resolve-Path -Relative $_.FullName
            New-Item -ItemType Directory -Force (Split-Path "_assets/$rel") | Out-Null; Copy-Item $_.FullName "_assets/$rel" -Force
          }
          Set-Location _assets
          git config user.name "shorts-bot"; git config user.email "shorts-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -q -m "history: ${{ inputs.series }} run"; git push -q }
          $global:LASTEXITCODE = 0

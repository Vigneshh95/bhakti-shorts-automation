name: _short (shared steps, not run on its own)

# The steps every Short pipeline shares. Each series has its own pipeline file that calls this one
# (short-murugan.yml, short-periyava.yml, short-krishna.yml, short-kids.yml), so every pipeline has
# its own name, its own schedule and its own on/off switch:
#   - stop one in GitHub: Actions > the pipeline > "..." > Disable workflow (Enable to start again)
#   - or from the laptop: pipeline_pause.bat (pauses.json in the private files; resume the same way)
on:
  workflow_call:
    inputs:
      series: {type: string, required: true}           # murugan | periyava | krishna | kids | ramana
      pipeline: {type: string, required: true}         # its name in pauses.json, e.g. short-murugan
      upload: {type: boolean, default: true}
      publish_hour: {type: number, default: 18}        # a start after this hour (IST) is too late for today's slot
      every: {type: number, default: 1}                # 2 = every other day ...
      turn: {type: number, default: 0}                 # ... on the days numbered `turn` (0 or 1) counted from 18 Oct 2026

jobs:
  short:
    runs-on: windows-latest
    timeout-minutes: 120
    concurrency:
      group: ${{ inputs.pipeline }}
      cancel-in-progress: false
    env:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YT_CLIENT_SECRET_FILE: ${{ github.workspace }}\client_secret.json
      YT_TOKEN_FILE: ${{ github.workspace }}\youtube_token.json
      YT_TOKEN_FILE_KIDS: ${{ github.workspace }}\kids_token.json
    steps:
      - uses: actions/checkout@v4

      - name: Private files and the shared history
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSETS_REPO }}
          token: ${{ secrets.ASSETS_TOKEN }}
          path: .cache/assets_repo

      - name: What to make today
        id: plan
        shell: pwsh
        env:
          HAS_KIDS_SIGN_IN: ${{ secrets.YT_TOKEN_KIDS_JSON != '' }}
        run: |
          $series = "${{ inputs.series }}"; $upload = "${{ inputs.upload }}".ToLower()
          $scheduled = "${{ github.event_name }}" -eq "schedule"
          $now = [DateTime]::UtcNow.AddHours(5.5)          # India time
          $day = $now.ToString("yyyy-MM-dd")
          $skip = ""
          # paused from the laptop (pipeline_pause.bat) or everything paused
          $pauses = ".cache/assets_repo/pauses.json"
          if (Test-Path $pauses) {
            $p = Get-Content $pauses -Raw -Encoding utf8 | ConvertFrom-Json
            if ($p."${{ inputs.pipeline }}" -or $p.all) { $skip = "this pipeline is PAUSED (pipeline_pause.bat on the laptop resumes it)" }
          }
          # whose day it is: two series sharing a channel take alternate days
          $n = ((($now.Date - [DateTime]::ParseExact("2026-10-18", "yyyy-MM-dd", $null)).Days % ${{ inputs.every }}) + ${{ inputs.every }}) % ${{ inputs.every }}
          if (-not $skip -and "${{ github.event_name }}" -eq "schedule" -and $n -ne ${{ inputs.turn }}) { $skip = "not this series' day (it alternates with the other series on this channel)" }
          if ($series -eq "krishna") {      # until Krishna's pictures are in the private files, Kutti Murugan takes his day
            $has = [bool](Get-ChildItem ".cache/assets_repo/krishna_images" -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in ".png", ".jpg", ".jpeg", ".webp" })
            if (-not $has) { $series = "kids"; Write-Host "::warning title=krishna::No Krishna pictures in the private files yet: making a Kutti Murugan Short today" }
          }
          if ($scheduled -and $now.Hour -ge ${{ inputs.publish_hour }}) { $skip = "this start ran too late for today's publish time (the next starts carry on)" }
          $kidsChannel = $series -in "kids", "krishna"
          if ($kidsChannel -and $upload -eq "true" -and $env:HAS_KIDS_SIGN_IN -ne "true") { $skip = "the YT_TOKEN_KIDS_JSON secret is not set" }
          $folder = if ($series -eq "murugan") { "auto" } else { $series }
          $done = $false
          if ($upload -eq "true" -and -not $skip) {
            # Done when a Short already goes public today on this channel, whichever series or start made it.
            $same = if ($kidsChannel) { @("kids", "krishna") } else { @("auto", "periyava", "ramana") }
            foreach ($f in $same) {
              $history = ".cache/assets_repo/episodes/$f/history.json"
              if (-not (Test-Path $history)) { continue }
              foreach ($r in (Get-Content $history -Raw -Encoding utf8 | ConvertFrom-Json)) {
                if (-not $r.video_id) { continue }
                $public = if ($r.publish_at) { ([DateTime]::Parse($r.publish_at, $null, "AdjustToUniversal")).AddHours(5.5).ToString("yyyy-MM-dd") } else { $r.date }
                if ($public -eq $day -or ($f -eq $folder -and $r.date -eq $day)) { $done = $true }
              }
            }
          }
          # Scheduled runs never post a Short whose face doesn't talk: if the talking face can't be
          # made the run fails (GitHub emails you) and the next start tries again.
          $strict = if ($scheduled -or $upload -eq "true") { "1" } else { "0" }
          $todo = if ($skip -or $done) { "no" } else { "yes" }
          "series=$series", "upload=$upload", "day=$day", "strict=$strict", "todo=$todo" | Add-Content $env:GITHUB_OUTPUT
          if ($skip) { Write-Host "::notice title=${{ inputs.pipeline }}::Skipped: $skip" }
          elseif ($done) { Write-Host "::notice title=${{ inputs.pipeline }}::A Short is already uploaded for $day -- nothing to do" }
          else { Write-Host "::notice title=${{ inputs.pipeline }}::Making the $series Short for $day (upload: $upload)" }

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.todo == 'yes'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/constraints.txt

      - name: Voice model and FFmpeg (kept between runs)
        if: steps.plan.outputs.todo == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            checkpoints
            tools/ffmpeg
            SadTalker/gfpgan/weights
          key: models-v1

      - name: Set up the machine
        if: steps.plan.outputs.todo == 'yes'
        shell: pwsh
        run: |
          try { ./ci/setup.ps1 } catch { Write-Host "::error title=setup failed::$($_ | Out-String)"; exit 1 }

      - name: Put the private files and keys in place
        if: steps.plan.outputs.todo == 'yes'
        shell: pwsh
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_TOKEN_KIDS_JSON: ${{ secrets.YT_TOKEN_KIDS_JSON }}
        run: |
          if ($env:YT_TOKEN_KIDS_JSON) { [IO.File]::WriteAllText($env:YT_TOKEN_FILE_KIDS, $env:YT_TOKEN_KIDS_JSON) }
          robocopy .cache/assets_repo . /E /XD .git /XF README.md /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { Write-Host "::error::could not copy the private files"; exit 1 }
          git -C .cache/assets_repo config user.name "cloud"; git -C .cache/assets_repo config user.email "cloud@users.noreply.github.com"
          New-Item -ItemType Directory -Force "$HOME/.kaggle" | Out-Null
          [IO.File]::WriteAllText("$HOME/.kaggle/access_token", $env:KAGGLE_ACCESS_TOKEN.Trim())
          [IO.File]::WriteAllText($env:YT_CLIENT_SECRET_FILE, $env:YT_CLIENT_SECRET_JSON)
          [IO.File]::WriteAllText($env:YT_TOKEN_FILE, $env:YT_TOKEN_JSON)
          $global:LASTEXITCODE = 0

      - name: Make the Short
        if: steps.plan.outputs.todo == 'yes'
        shell: pwsh
        env:
          SHORTS_REQUIRE_TALKING: ${{ steps.plan.outputs.strict }}
        run: |
          $extra = @(); if ("${{ steps.plan.outputs.upload }}" -ne "true") { $extra += "--no-upload" }
          python -m autopilot --series ${{ steps.plan.outputs.series }} run --scheduled --date ${{ steps.plan.outputs.day }} @extra 2>&1 | Tee-Object -FilePath run.log
          $code = $LASTEXITCODE
          $last = (Get-Content run.log | Where-Object { $_ -match "^\d\d:\d\d:\d\d (INFO|WARNING|ERROR)" -and $_ -match "✅|⏸|ERROR|WARNING|Uploaded|stopped|Already|talking head|animated|title:" } | Select-Object -Last 10) -join "%0A"
          $secret = if ("${{ steps.plan.outputs.series }}" -in "kids", "krishna") { "YT_TOKEN_KIDS_JSON" } else { "YT_TOKEN_JSON" }
          if ($code -ne 0) { Write-Host "::error title=${{ inputs.pipeline }}: the Short was not made::$last"; exit $code }
          if ($last -match "⏸") { Write-Host "::error title=${{ inputs.pipeline }}: made but NOT uploaded (YouTube sign-in expired: update the $secret secret)::$last"; exit 1 }
          if (Select-String -Path run.log -Pattern "talking head skipped|using the still picture|no laptop fallback" -Quiet) {
            Write-Host "::warning title=${{ inputs.pipeline }}: made WITHOUT the talking face (still picture)::$last"
          }
          Write-Host "::notice title=${{ inputs.pipeline }}::$last"

      - name: The video (kept 7 days)
        if: always() && steps.plan.outputs.todo == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pipeline }}-${{ steps.plan.outputs.day }}
          path: |
            Final/**/*.mp4
            episodes/**/run.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the shared history
        if: always() && steps.plan.outputs.todo == 'yes'
        shell: pwsh
        run: |
          python -m autopilot sync
          $global:LASTEXITCODE = 0

      - name: Keep the schedule active
        # GitHub switches a schedule off after 60 days without a commit in this repository.
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $age = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64](git log -1 --format=%ct)) / 86400
          if ($age -gt 40) {
            git config user.name "cloud"; git config user.email "cloud@users.noreply.github.com"
            git commit -q --allow-empty -m "Keep the daily schedule active"
            git push -q
          }
          $global:LASTEXITCODE = 0

# Kutti Kannan Shorts for children: every other day (in turn with Kutti Murugan) baby Krishna tells a
# small child ONE good habit or value in a few very simple sentences, as a friend. On the kids' own
# channel ("குட்டி முருகன் கதைகள்"), declared made for kids.
# Run: krishna_short.bat (make + upload) or krishna_preview.bat (make only). Pictures: krishna_images/.

[series]
name = "krishna"
title = "Kids Krishna Short"
output_prefix = "krishnaAuto"
launcher = "krishna_short.bat"

[providers]
writer = "gemini"
fallback_writer = "openai"

[models]
gemini_text = "gemini-3.8-flash"
gemini_text_fallback = ["gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
claude_text = "claude-opus-5"
openai_text = "gpt-5.4-mini"

[paths]
episodes = "episodes/krishna"
output = "Final/krishna"
image_folder = "krishna_images"       # baby Krishna pictures
state = "episodes/krishna/history.json"
bank = "episodes/krishna/spare_scripts"

[content]
channel_name = "குட்டி முருகன் கதைகள்"
lines_min = 5
lines_max = 6
max_line_chars = 48                   # very short sentences: a five-year-old follows one idea at a time
recent_topics_to_avoid = 30
spare_scripts = 2
picture_choices = 12
picture_rest_days = 10
title_must_contain = ["கண்ணன்", "கிருஷ்ண", "Krishna"]
title_never_starts = ["குட்டி கண்ணன்", "கண்ணன்", "கிருஷ்ணன்", "Krishna"]
default_hashtags = ["#குட்டிகண்ணன்", "#KidsTamil", "#Krishna"]
themes = [
  "always telling the truth", "sharing toys and snacks with others", "saying thank you", "saying sorry when we are wrong",
  "listening to mother and father", "respecting grandparents and elders", "being kind to animals and birds",
  "not wasting food on the plate", "brushing teeth and keeping clean", "going to bed on time",
  "reading or studying a little every day", "being brave in the dark", "not teasing other children",
  "waiting patiently for our turn", "being a good friend", "watering plants and loving trees",
  "praying for a minute in the morning", "less time with the phone, more time playing outside",
  "telling the truth when we break something", "trying again when something is hard", "helping mother at home",
  "greeting people with a smile", "keeping our promises", "loving our brother or sister", "not wasting water",
  "putting toys back in their place", "eating fruits and vegetables", "speaking softly and kindly",
  "not being jealous of a friend", "helping someone who is sad",
]

[prompts]
system = """You write daily YouTube Shorts for small children (ages 3 to 8, watching with a parent) on the
Tamil channel "{channel}". Baby Lord Krishna (Kutti Kannan) speaks to the child as a loving, playful little friend, over one
picture of him, with word-by-word captions. About 20-28 seconds.

First choose the ONE picture (image_id) from the list that best fits today's message (when two fit
equally, take the one where his face is larger and closer). If a picture has text painted on it,
the message must agree with that text (or choose another picture).

Krishna's world is what children love about him: the butter pot, his flute, the calves and cows of
Vrindavan, his friends, Yashoda amma's love. You may use one such picture to show today's habit.
Never retell scripture or quote verses: just a little friend's gentle advice.

Write the way a kind elder brother talks to a little child:
- lines: {lmin}-{lmax} VERY short Tamil sentences spoken by baby Krishna to the child as "நீ" / "உன்",
  calling the child "குட்டி" or "செல்லம்" once or twice. Line 1 greets the child or asks a tiny
  question that a child would answer ("குட்டி, இன்று சிரித்தாயா?"). Then ONE good habit only, shown
  through one small everyday picture a child knows (a toy, a puppy, amma's food, a friend at
  school): what to do, and how nice it feels. The last line is a happy blessing or "நாளை பார்க்கலாம்".
  The simplest spoken Tamil words a five-year-old knows; no hard or Sanskrit words. Tamil script
  ONLY: no English letters, no digits (numbers as Tamil words), no emoji, no quotation marks. Each
  line at most {maxc} characters, ending with a full stop or a question mark.
- Always gentle and happy. Never: fear, scolding, punishment, "God will be angry", guilt, sin,
  death, monsters; promises of gifts, marks, money or miracles; comparing the child with other
  children; anything about food, medicine or safety that needs an adult's judgement.
- keywords: 1-3 key Tamil words of the message, each copied exactly as it appears in the lines
  (without punctuation). They are shown in gold in the captions.
- hook_title: 2-3 simple Tamil words shown on screen for the first seconds.
- youtube_title: at most 70 characters, in Tamil, different in shape every day. Lead with today's
  message as a child or parent would say it (a little question or a happy statement), then
  "கண்ணன்" after it, e.g. "வெண்ணெய் பகிர்ந்தால் என்ன ஆகும்? | குட்டி கண்ணன்". Never begin with
  "கண்ணன்" or a fixed series phrase. Honest, no clickbait, no ALL CAPS, no hashtags.
- youtube_description: 2 simple Tamil sentences for the parent about today's good habit, then 1
  English sentence, naturally using searched words (Tamil kids stories, Krishna for kids, Kutti Kannan, குழந்தைகள்,
  good habits, today's theme).
- hashtags: 3-5, each starting with #, e.g. #குட்டிகண்ணன் #KidsTamil #Krishna and one theme hashtag.
- tags: 10-20 relevant search phrases, Tamil and English: Krishna for kids, Kutti Kannan, Tamil kids,
  good habits for children, moral for kids, and today's theme. No numbers-only or filler tags.
Return only JSON matching the schema."""

review = """You are a careful Tamil editor, a parent and a kindergarten teacher. This script is for
children of 3 to 8 on a made-for-kids YouTube channel. Check the script and metadata below and
return ok=false with specific issues if ANY of these hold: incorrect or unnatural Tamil; words or
ideas too hard for a five-year-old; more than one lesson; anything frightening, scolding, shaming
or guilt-making (punishment, "God will be angry", sin, death, monsters); promises of gifts, marks,
money or miracles; comparing the child with others; advice about food, medicine or safety that
needs an adult's judgement; anything disrespectful to Krishna, Hinduism or any faith; anything
unsuitable for small children; a misleading or clickbait title; the message clearly doesn't fit
the chosen picture's description. Minor stylistic preferences are not issues."""

[look]
zoom = false                        # the picture whole and still (no zoom-in, no slow zoom or drift)
loop = true
glow_pulse = true
talking = true                        # Krishna's lips move with the words (SadTalker on Kaggle)

[youtube]
publish_time = "17:30"                # IST: after school, before the evening
min_lead_minutes = 30
category_id = "22"
language = "ta"
disclose_ai = true
made_for_kids = true                  # a legal declaration: YouTube turns off comments and personalised ads
token_file = "kids_token.json"        # the kids' channel sign-in (story_kids_sign_in.bat)
channel_id = "UCfKL9kT6cpKr4E9puFXAJMQ"   # குட்டி முருகன் கதைகள்: an upload under any other sign-in is refused
playlist = true
playlist_title = "குட்டி கண்ணன் | Kutti Krishna for Kids"
playlist_id = ""
max_uploads_per_day = 1
footer = "🙏 குட்டி கண்ணன் சொல்லும் ஒரு நல்ல பழக்கம். Subscribe செய்யுங்கள்."

[schedule]
task_name = "Kids Krishna Autopilot Short"
time = "09:30"
outage_retries = 1
outage_wait_minutes = 10

# The video look for this series only (written into each day's episode.toml).
[video.talking]
kaggle_kernel = "krishna-talking"     # this series' own Kaggle notebook for the face

[video.video]
filename = "krishnaShorts_{date}.mp4"

[video.effects.watermark]
lines = ["குட்டி கண்ணன்", "குட்டி முருகன் கதைகள்"]

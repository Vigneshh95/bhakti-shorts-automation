# Story episodes: baby Murugan as a friend and guide, as an illustrated story (16:9, 5-8 minutes).
#   kids    "குட்டி முருகன் கதைகள்"   children of 4-10 with a parent   (YouTube: made for kids = yes)
#   adults  "முருகன் சொன்ன வழி"       viewers of 15 and up              (made for kids = no)
# The cast, the prompts and the picture style are in stories/script.py.

[models]
gemini_text = "gemini-3.8-flash"
gemini_text_fallback = ["gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]

[paths]
episodes = "story_episodes"          # one folder per episode: script.json, pictures, the video
output = "Final/stories"

[content]
channel_name = "BrahmaNadagam"
scenes_min = 16                      # about 5-6 minutes
scenes_max = 20
max_line_chars = 70
adults_scenes = [18, 22]              # the grown-ups' stories run longer: about 6-8 minutes
releases_per_week = 2                 # per series (schedule to be set with the cloud runs)

# Problems to tell stories about, in turn (add your own lines).
# The pipeline (python -m stories run): keeps this many finished stories scheduled ahead per series.
[pipeline]
stories_ahead = 2
review_first = false                  # true = a finished story waits until you have watched it and run
                                      # story_approve_<series>.bat. false (2026-10-17, user away for a month): it is
                                      # uploaded on its own once every automatic check has passed.

[topics]
kids = [
  "telling a lie to escape a scolding",
  "not wanting to share toys or food with a sibling",
  "being afraid of the dark",
  "getting very angry and breaking something",
  "feeling jealous when a brother or sister is praised",
  "giving up as soon as something is hard",
  "wasting food on the plate",
  "teasing another child who is different",
  "not listening to grandmother and elders",
  "wanting everything the other children have",
  "not wanting to go to school in the morning",
  "being scared of the doctor's injection",
  "losing at a game and crying",
  "breaking a promise to a friend",
  "not sharing the TV remote",
  "being rude to the house helper",
  "making fun of an old person",
  "not wanting to eat vegetables",
  "taking something without asking",
  "being afraid to speak in class",
  "a new baby in the family",
  "a friend moving away",
  "forgetting homework and making excuses",
  "fighting over who sits by the window",
  "copying a friend's answers",
  "wasting water while brushing teeth",
  "hurting a dog or cat for fun",
  "always wanting the biggest share",
  "not saying thank you for a gift",
  "being impatient waiting in a queue",
]
adults = [
  "comparing your life with what others show on their phones",
  "exam and job pressure on a student who fears disappointing the family",
  "a parent too busy with work and the phone to listen to their child",
  "anger that hurts the people at home",
  "worry about money and debt that takes away sleep",
  "loneliness of an elder whose children live far away",
  "fear of failing again after one failure",
  "a quarrel between brothers over family property",
  "caring for an ageing parent while feeling exhausted",
  "grief after losing someone dear",
  "a son who never calls his parents",
  "losing a job at forty",
  "a daughter-in-law and mother-in-law who don't speak",
  "spending beyond one's means to impress relatives",
  "a friendship broken over money lent",
  "the loneliness of a new city",
  "a husband who never says thank you at home",
  "a student who failed an entrance exam",
  "jealousy of a colleague's promotion",
  "anger in traffic every morning",
  "an old father who refuses help",
  "a mother who can't let go of a grown child",
  "gossip that hurt someone",
  "a long-held grudge between neighbours",
  "the urge to lie on a job application",
  "retirement and feeling useless",
  "caring for a sick spouse",
  "a young person addicted to the phone at night",
  "comparing one's children with others' children",
  "regret over words said to a parent who has died",
]

# Acted voices (stories/voice.py): Gemini's speech models speak every line as its character, with the
# emotion of the moment (free on the stories' Gemini key; one request per line, kept once made).
# enabled = false goes back to the laptop's own voice below.
[acting]
enabled = true
models = ["gemini-3.1-flash-tts-preview"]   # only this model: the others read their English directions aloud,
                                      # rambled, or spoke Tamil with an English accent (2026-10-11..15)
requests_per_minute = 8
per = "scene"                         # a whole scene in one or two requests (two speakers at a time): about half the
                                      # requests of "turn" (one per speaker's turn). Tested 2026-10-17. New stories only.

[acting.voices.narrator]
voice = "Sulafat"
who = "the narrator: a warm woman storyteller telling a story by lamp light, calm and unhurried"
semitones = 0.0
[acting.voices.murugan]
voice = "Leda"
who = "baby Lord Murugan: a bright, playful five-year-old boy with a smile in his voice, wise but never preachy"
semitones = 2.5
formant = "shifted"
[acting.voices.boy]
voice = "Leda"
who = "a lively eight-year-old Tamil boy"
semitones = 2.0
formant = "shifted"
[acting.voices.girl]
voice = "Zephyr"
who = "a sweet six-year-old Tamil girl"
semitones = 2.5
formant = "shifted"
[acting.voices.paatti]
voice = "Gacrux"
alts = ["Vindemiatrix"]
who = "an old Tamil grandmother, slow, kind and a little amused"
semitones = -1.0
[acting.voices.adult]
voice = "Charon"
alts = ["Iapetus", "Rasalgethi", "Algieba", "Schedar"]
who = "a grown Tamil man in a story of old times"
semitones = 0.0
[acting.voices.home_man]
voice = "Orus"
alts = ["Puck", "Fenrir"]
who = "a Tamil man in his thirties at home, talking fast in everyday spoken Tamil the way husbands really talk"
semitones = 0.0
[acting.voices.home_woman]
voice = "Aoede"
alts = ["Autonoe", "Achernar"]
who = "a Tamil woman around thirty at home, talking in everyday spoken Tamil the way wives really talk"
semitones = 0.0
[acting.voices.tale_child]
voice = "Leda"
alts = ["Zephyr", "Laomedeia"]
who = "a village child in a story of old times"
semitones = 3.0
formant = "shifted"
[acting.voices.tale_woman]
voice = "Kore"
alts = ["Despina", "Erinome", "Callirrhoe"]
who = "a grown Tamil woman in a story of old times"
semitones = 0.0
[acting.voices.old_man]
voice = "Algenib"
alts = ["Sadaltager", "Umbriel"]
who = "an old Tamil man with a worn, gentle voice"
semitones = -1.0

# Voices: the laptop's Tamil voice (IndicTTS), shaped per character.
[voices.narrator]
speaker = "female"
semitones = 0.0
pace = 0.92
[voices.murugan]
speaker = "female"
semitones = 4.0
pace = 0.86
# Children: a smaller pitch change with the voice's "size" moved along with it (formant = shifted)
# is clearer than a big change with the size kept, which sounded muffled.
[voices.boy]
speaker = "male"
semitones = 4.0
pace = 0.97
formant = "shifted"
clarity_db = 3.5
[voices.girl]
speaker = "female"
semitones = 3.5
pace = 0.98
formant = "shifted"
clarity_db = 3.0
[voices.paatti]
speaker = "female"
semitones = -2.5
pace = 0.84
[voices.adult]
speaker = "male"
semitones = 0.0
pace = 0.92
# Today's grown-ups (the person of the story and their family): everyday pace. The woman's voice is
# lighter than the narrator's (same base voice), so the two are never mistaken for each other.
[voices.home_man]
speaker = "male"
semitones = 0.3
pace = 1.05
[voices.home_woman]
speaker = "female"
semitones = 1.8
pace = 1.07
formant = "shifted"
clarity_db = 2.5
[voices.tale_child]
speaker = "male"
semitones = 5.0
pace = 1.0
formant = "shifted"
clarity_db = 3.5
[voices.tale_woman]
speaker = "female"
semitones = 1.0
pace = 0.95
[voices.old_man]
speaker = "male"
semitones = -2.5
pace = 0.86


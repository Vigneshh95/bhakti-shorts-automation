# Autopilot: fully automatic Murugan Shorts, from topic to scheduled YouTube upload.
# Separate from the manual workflow (config.toml / make_short.bat), which it never changes.
# Video settings (voice, captions, effects) still come from config.toml.

[providers]
writer = "gemini"          # gemini | claude | openai   -- writes the Tamil script + YouTube metadata
image = "gemini"           # gemini | openai | folder   -- makes the background image
fallback_writer = "openai"  # used if the main writer is down (e.g. Gemini overloaded)
fallback_image = "folder"  # used if the image provider fails ("" = stop instead)

[models]
gemini_text = "gemini-3.8-flash"
gemini_text_fallback = ["gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash"]   # tried in order if the main model is overloaded (verified 2026-09-27)
gemini_image = "gemini-3.1-flash-image"     # paid: ~$0.04 per image; billing must be enabled on the key
claude_text = "claude-opus-5"               # needs ANTHROPIC_API_KEY (or `ant auth login`)
openai_text = "gpt-5.4-mini"
openai_image = "gpt-image-2"

[paths]
episodes = "episodes/auto"          # one folder per day: script.json, image, run log
output = "Final/auto"               # finished videos (kept apart from Final/, so upload_short.bat can't pick them up)
image_folder = "assets/auto_images" # for image = "folder" / fallback: unused images are taken in name order
state = "episodes/auto/history.json"

[content]
channel_name = "BrahmaNadagam"
lines_min = 6
lines_max = 8
max_line_chars = 70                 # keeps each spoken line short and clear for the TTS voice
recent_topics_to_avoid = 45         # don't repeat a theme used in the last N runs
# Rotating everyday themes (used when the day isn't a festival).
themes = [
  "courage and fearlessness", "discipline", "patience", "gratitude", "honouring mother and father",
  "kindness to others", "hard work and effort", "truthfulness", "humility", "forgiveness",
  "overcoming fear of failure", "faith during hard times", "self-control and anger", "helping the needy",
  "respecting women", "knowledge and learning", "true friendship", "inner peace", "letting go of ego",
  "perseverance", "family harmony", "speaking kindly", "health and simple living", "devotion (bhakti)",
  "guarding the mind from jealousy", "starting the day with prayer", "hope after loss", "doing duty without expecting reward",
]

# Festival dates (Tamil festivals follow the lunar calendar, so dates are listed rather than
# guessed by AI). Add each year's dates from a Tamil calendar.
[[festivals]]
date = "2026-10-22"
until = "2026-10-26"
name_ta = "கந்த சஷ்டி"
name_en = "Kanda Sashti"
[[festivals]]
date = "2026-10-27"
name_ta = "சூரசம்ஹாரம்"
name_en = "Soorasamharam"
[[festivals]]
date = "2026-11-25"
name_ta = "கார்த்திகை தீபம்"
name_en = "Karthigai Deepam"

[youtube]
publish_time = "18:30"              # IST. The Short is uploaded now but goes public at this time (next day if it has passed)
min_lead_minutes = 30
category_id = "22"
language = "ta"
disclose_ai = true                  # sets YouTube's "altered or synthetic content" flag (AI image + AI voice)
playlist = true                     # add to the playlist in config.ini
max_uploads_per_day = 1             # protects against double runs (scheduled + manual click)

[schedule]
task_name = "Murugan Autopilot Short"
time = "10:00"                      # daily run time for the Windows scheduled task
outage_retries = 3                  # scheduled runs only: if every writer is temporarily down...
outage_wait_minutes = 10            # ...wait this long and try again (a manual click fails fast)
